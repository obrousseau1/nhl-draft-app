name: CI

on:
  push:
    branches: ['**']

permissions:
  contents: read

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet build NhlDraftApp.slnx
      - run: dotnet test NhlDraftApp.slnx --no-build
