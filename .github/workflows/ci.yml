name: CI

on:
  push:
    branches: ['**']

permissions:
  contents: read

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet build NhlDraftApp.slnx
      - run: dotnet test NhlDraftApp.slnx --no-build

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typeCheck
      - run: pnpm run test
      - run: pnpm run build
      - uses: actions/upload-artifact@v4
        with:
          name: wwwroot
          path: api/NhlDraftApp.Api/wwwroot

  publish:
    needs: [dotnet, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v5
        with:
          name: wwwroot
          path: api/NhlDraftApp.Api/wwwroot
      - run: dotnet publish api/NhlDraftApp.Api -c Release -o publish
      - run: test -f publish/wwwroot/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: publish
